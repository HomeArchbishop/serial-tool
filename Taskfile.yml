version: '3'

vars:
  APP_NAME: "serial-tool"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    deps:
      - task: depth:helper
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  depth:helper:
    desc: Build the Orbbec depth helper and stage SDK runtime files in bin/
    run: once
    cmds:
      - bash scripts/build-depth-helper.sh
