name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (e.g. 0.1.0). Creates tag + release from this commit.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: serial-tool
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'
  WAILS3_VERSION: 'v3.0.0'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            TAG="v${VER}"
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid version: ${VER}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} (${VER})"

      - name: Ensure tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            artifact: serial-tool-darwin-universal
          - os: windows-latest
            goos: windows
            artifact: serial-tool-windows-amd64
          - os: ubuntu-24.04
            goos: linux
            artifact: serial-tool-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Must run BEFORE `go install wails3` — installing the CLI compiles
      # linux CGO code that needs gtk4/webkitgtk pkg-config.
      - name: Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev
          pkg-config --exists gtk4 webkitgtk-6.0
          pkg-config --modversion gtk4 webkitgtk-6.0

      - name: Install wails3
        shell: bash
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Bump version
        shell: bash
        run: |
          VER='${{ needs.version.outputs.version }}'
          perl -i -pe "s/^  version: .*/  version: \"${VER}\"/" build/config.yml
          grep -n 'version:' build/config.yml | head -5

      - name: Build macOS universal .app
        if: matrix.goos == 'darwin'
        run: |
          wails3 doctor || true
          wails3 task darwin:package:universal
          cd bin
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "${{ matrix.artifact }}.zip"
          ls -la

      - name: Build Windows depth helper
        if: matrix.goos == 'windows'
        shell: bash
        run: bash scripts/build-depth-helper.sh

      - name: Build Windows exe
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          wails3 doctor
          if ($LASTEXITCODE -ne 0) { Write-Host "doctor reported warnings" }
          wails3 task windows:build ARCH=amd64
          if (!(Test-Path "bin/$env:APP_NAME.exe")) { throw "missing bin/$env:APP_NAME.exe" }
          if (!(Test-Path "bin/orbbec-depth.exe")) { throw "missing depth helper" }
          $files = @(
            "bin/$env:APP_NAME.exe",
            "bin/orbbec-depth.exe",
            "bin/OrbbecSDKConfig_v1.0.xml"
          ) + (Get-ChildItem "bin/*.dll").FullName
          Compress-Archive -Path $files -DestinationPath "bin/${{ matrix.artifact }}.zip" -Force
          Get-ChildItem bin

      - name: Build Linux binary
        if: matrix.goos == 'linux'
        run: |
          wails3 doctor || true
          wails3 task linux:build ARCH=amd64
          test -x "bin/orbbec-depth"
          cd bin
          tar -czf "${{ matrix.artifact }}.tar.gz"             "${APP_NAME}" orbbec-depth *.so* OrbbecSDKConfig_v1.0.xml
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/${{ matrix.artifact }}.zip
            bin/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        shell: bash
        run: |
          mkdir -p out
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -exec cp {} out/ \;
          ls -la out
          test -n "$(ls -A out)"

      - name: Create checksums
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: serial-tool ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: out/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
